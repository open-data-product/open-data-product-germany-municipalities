          - { key: association_id, value: "", operation: equals }
      - source_file_name: germany-municipalities-2026-03.csv
        target_file_name: germany-municipalities-2026-03-associations.csv
        names: *associations
        filters:
          - { key: association_id, value: "", operation: does_not_equal }
          - { key: municipality_id, value: "", operation: equals }
