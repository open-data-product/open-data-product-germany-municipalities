input_ports:
  - id: germany-municipalities-2026-03
    files:
      - source_file_name: germany-municipalities-2026-03.csv
        target_file_name: germany-municipalities-2026-03-federal-states.csv
        names: *federal_states
        filters:
          - { key: federal_state_id, value: "", operation: does_not_equal }
          - { key: admin_district_id, value: "", operation: equals }
      - source_file_name: germany-municipalities-2026-03.csv
        target_file_name: germany-municipalities-2026-03-admin-districts.csv
